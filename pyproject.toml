[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airguard-ai"
version = "0.1.0"
description = "AirGuard AI 官方資料處理與驗證（W1）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
